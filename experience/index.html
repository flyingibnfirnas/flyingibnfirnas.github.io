<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Journey — Flying Ibn Firnas</title>
    <meta
      name="description"
      content="An interactive 3D journey through Mohamed Helal's engineering career — aerospace avionics, robotic calibration, flight simulation, and automotive diagnostics."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #07090c;
        color: #f2f2f2;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        gap: 0.85rem;
        text-align: center;
        background: #07090c;
        transition: opacity 0.35s ease;
      }
      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto;
        border: 1.5px solid rgba(232, 122, 32, 0.45);
        border-radius: 50%;
        border-top-color: #e87a20;
        animation: spin 0.9s linear infinite;
      }
      #boot-splash p {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        color: #a8aeb8;
      }
      #boot-splash .err {
        color: #e87a20;
        max-width: 22rem;
        line-height: 1.45;
        font-size: 0.85rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-live="polite">
      <div class="mark" aria-hidden="true"></div>
      <p id="boot-splash-text">Loading engineering journey…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
