<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flying Ibn Firnas — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e4e4e7;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
    }

    .bg-glow--1 {
      top: -200px;
      left: -100px;
      background: #6366f1;
    }

    .bg-glow--2 {
      bottom: -250px;
      right: -150px;
      background: #0ea5e9;
    }

    .container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
      max-width: 540px;
    }

    .logo {
      font-size: 2.5rem;
      margin-bottom: 0.25rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #e4e4e7 0%, #6366f1 50%, #0ea5e9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 1.1rem;
      font-weight: 300;
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #0ea5e9);
      border: none;
      margin: 0 auto 2.5rem;
      border-radius: 1px;
    }

    .badge {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 400;
      color: #a1a1aa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      background: rgba(99, 102, 241, 0.05);
    }

    .links {
      margin-top: 2rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      color: #71717a;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .links a:hover {
      color: #e4e4e7;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <div class="container">
    <div class="logo">🪽</div>
    <h1>Flying Ibn Firnas</h1>
    <p class="tagline">Something new is on the way.<br>Stay tuned.</p>
    <hr class="divider">
    <span class="badge">Coming Soon</span>
    <div class="links">
      <a href="https://github.com/flyingibnfirnas" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>
</html>
